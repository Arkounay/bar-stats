# Builds every supported platform and attaches the binaries to a GitHub
# release. Triggered by pushing a version tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # Windows binaries carry a VERSIONINFO resource so the executable shows
      # proper product, company and version metadata.
      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Build all platforms
        run: |
          mkdir -p dist build
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            mkdir -p build
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"

            rm -f cmd/*/*.syso
            if [ "$os" = "windows" ]; then
              archflag="-64"
              [ "$arch" = "arm64" ] && archflag="-64 -arm"
              for c in barreplays barstats-desktop; do
                goversioninfo $archflag -o "cmd/$c/resource_windows_${arch}.syso" versioninfo.json
              done
            fi

            # Pure Go: no cgo, so every target cross-compiles from one runner.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
              -o "build/barstats$ext" ./cmd/barreplays

            # The desktop flavour is the same server shown in a chromeless
            # application window. On Windows it links as a GUI binary so that
            # double-clicking it does not leave a console window behind.
            desktopflags="-s -w"
            [ "$os" = "windows" ] && desktopflags="-s -w -H windowsgui"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$desktopflags" \
              -o "build/barstats-desktop$ext" ./cmd/barstats-desktop

            # Shipped as archives rather than bare executables: browsers and
            # Windows Defender treat a directly-downloaded .exe far more
            # aggressively than the same file inside an archive. Both flavours
            # travel together, so a user who dislikes one has the other to hand
            # without a second download.
            if [ "$os" = "windows" ]; then
              (cd build && zip -q "../dist/barstats-$os-$arch.zip" "barstats$ext" "barstats-desktop$ext")
            else
              tar -czf "dist/barstats-$os-$arch.tar.gz" -C build "barstats$ext" "barstats-desktop$ext"
            fi
            rm -rf build
          done
          rm -f cmd/*/*.syso
          ls -lh dist

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
